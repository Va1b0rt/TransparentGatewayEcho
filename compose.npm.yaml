name: transparent-gateway-echo
services:
  echo:
    build: .
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      PROXY_KIND: npm
      RATE_LIMIT: ${RATE_LIMIT:-60}
      RATE_PERIOD: ${RATE_PERIOD:-60}
    networks:
      npm:
        aliases: [tg-public-echo]
    mem_limit: 128m
    pids_limit: 64
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '2'}
networks:
  npm:
    external: true
    name: ${NPM_NETWORK:-nginx-proxy-manager_default}
