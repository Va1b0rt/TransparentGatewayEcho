name: tg-npm-test
services:
  echo:
    build: ../..
    environment:
      PROXY_KIND: npm
      RATE_LIMIT: 8
      RATE_PERIOD: 10
  nginx:
    image: nginx:stable-alpine@sha256:dc5069ad14f19660b141b21236140b91656bf89bbc3e2417c70ae650cd66104c
    ports: ['127.0.0.1:18081:8081']
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../npm-advanced.conf:/etc/nginx/echo.conf:ro
