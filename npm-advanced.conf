# Paste the entire file into this Proxy Host's Advanced field.
# Keep Custom Locations empty; this block replaces NPM's default location.
location / {
    access_log off;
    error_log /dev/null crit;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection close;
    # Physical peer BEFORE NPM's real-IP rewriting (Cloudflare edge or direct client).
    proxy_set_header X-TG-Peer $realip_remote_addr;
    proxy_set_header X-TG-Original-XFF $http_x_forwarded_for;
    # Preserve received diagnostic headers rather than adding NPM's own values.
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Real-IP $http_x_real_ip;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    proxy_buffering off;
    proxy_cache off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    proxy_pass $forward_scheme://$server:$port$request_uri;
}
